name: Veil
options:
  bundleIdPrefix: com.veilbrowser
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: Veil
    info:
      path: Veil/Info.plist
      properties:
        CFBundleDisplayName: Veil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Veil uses Face ID to lock your private tabs.
        NSPhotoLibraryAddUsageDescription: Veil saves videos you export to your photo library.
        NSCameraUsageDescription: Websites can ask to use the camera when you upload a photo or video.
        NSMicrophoneUsageDescription: Websites can ask to use the microphone when you record a video to upload.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veilbrowser.veil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
