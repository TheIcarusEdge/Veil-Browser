name: Build Veil

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Veil.xcodeproj \
            -target Veil \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # On failure, this step lists only the error lines so they're easy to copy.
      # Each one also becomes a GitHub annotation, which Claude can read through the API.
      - name: Show Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then echo "No error lines found. Check the full log."; exit 0; fi
          cat errors.txt
          # GitHub keeps at most 10 annotations per step, so the full list also goes in one combined annotation.
          all=$(python3 -c "import os; t=open('errors.txt').read().replace(os.getcwd()+'/', ''); print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=All build errors::${all}"
          head -9 errors.txt | while IFS= read -r line; do
            if [[ "$line" =~ ^(/[^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              file="${BASH_REMATCH[1]#$PWD/}"
              echo "::error file=${file},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::${line}"
            fi
          done

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Veil.app Payload/
          zip -qry Veil.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-ipa
          path: Veil.ipa
