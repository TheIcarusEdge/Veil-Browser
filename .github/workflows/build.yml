name: Build Veil

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Veil.xcodeproj \
            -target Veil \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # On failure, this step lists only the error lines so they're easy to copy.
      - name: Show Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60 || echo "No error lines found. Check the full log."

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Veil.app Payload/
          zip -qry Veil.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-ipa
          path: Veil.ipa
